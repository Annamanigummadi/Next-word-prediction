<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Next Word Prediction using Bigram</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Next Word Prediction</h1>

        <form method="POST">
            <input type="text" name="sentence" placeholder="Enter a sentence" 
                   value="{{ sentence }}" required>
            <br><br>
            <button type="submit">Predict Next Word</button>
        </form>

        {% if predictions %}
        <div class="result">
            <h3>Top Predictions:</h3>
            <ul>
                {% for word, prob in predictions %}
                <li>{{ word }} → {{ "%.2f"|format(prob) }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <p class="note">
            Predictions generated using Python Bigram Model
        </p>
    </div>
</body>
</html>
